packages:
  - '.'

# Which dependencies may run their install scripts. pnpm blocks all of them by
# default and fails the install while any package is neither allowed nor
# refused — with no TTY that is a hard stop, which is exactly what happened on
# the first CI run of this project.
#
# The key is `allowBuilds`. It replaces pnpm 10's `onlyBuiltDependencies`,
# which pnpm 11 silently ignores: the list stood here since Phase 1 and had no
# effect, visible only in a fresh install (an existing node_modules never
# re-asks). `pnpm config list` shows the packages awaiting a decision.
#
# true  — the toolchain needs the script: Prisma fetches its query engines,
#         esbuild and protobufjs place their binaries.
# false — transitive native optionals of testcontainers (ssh2, cpu-features)
#         and of the ESLint resolver (unrs-resolver). All three ship prebuilt
#         platform packages and work without their build step; the full check
#         chain runs green with them refused.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  protobufjs: true
  cpu-features: false
  ssh2: false
  unrs-resolver: false
  # Nur für next/image, das dieses Projekt nicht benutzt — die einzige
  # Bilddarstellung ist der Fotonachweis, und der kommt aus dem
  # Objektspeicher. sharp bringt vorgebaute Binärdateien mit, sein
  # Build-Skript wird also auch dann nicht gebraucht, wenn es einmal
  # dazukommt.
  sharp: false

# Erzwungene Fassungen transitiver Abhängigkeiten.
#
# deepmerge-ts: GHSA-ggr8-5vv4-36mx (Stack-Erschöpfung beim Zusammenführen
# rekursiver Objektgraphen). Der verwundbare Stand hängt unter
# `prisma > @prisma/config`, und Prisma 7.9.1 ist die neueste Fassung — es
# gibt also keine Aktualisierung, die ihn mitzieht.
#
# Erreichbar ist die Stelle nur über `prisma.config.ts`, eine Datei aus dem
# Repository und nicht aus fremder Hand. Der Override steht trotzdem hier:
# eine bekannte Schwachstelle unbehandelt stehen zu lassen, weil sie gerade
# nicht erreichbar ist, verlagert die Prüfung auf jeden künftigen Leser.
overrides:
  deepmerge-ts: '>=8.0.0'

# Geflickte Abhängigkeiten.
#
# eslint-plugin-react: eine Zeile, die ESLint 10 blockierte. `resolveBasedir`
# in `lib/util/version.js` rief `context.getFilename()` ungeschützt auf — eine
# Methode, die ESLint 10 entfernt hat. Der Lauf starb sofort und für jede
# Datei, beim Ermitteln der React-Fassung für `react/display-name`.
#
# Bemerkenswert ist, wo der Fehler NICHT sitzt: dieselbe Datei hat für alle
# anderen entfernten Methoden eine Rückfalllogik (`sourceCode.x ?? context.x`).
# Genau diese eine Stelle hat sie nicht. Der Patch setzt sie ein, in derselben
# Form wie die Nachbarn.
#
# **Warum geflickt und nicht gewartet.** Das Plugin steht seit April 2025 auf
# 7.37.5 und nennt `^9.7` als Peer-Obergrenze; die Sperre in
# `.github/dependabot.yml` hätte auf ein Release gewartet, das seit über einem
# Jahr nicht kommt. Geprüft wurde nicht nur, dass der Lauf durchgeht, sondern
# dass die Regeln danach noch **greifen**: 33 react-Regeln aktiv, und eine
# absichtlich fehlerhafte Datei wird von `react/jsx-key` gefangen.
#
# **Was beim nächsten Mal zu tun ist.** Der Patch hängt an der Fassung 7.37.5.
# Zieht das Plugin nach, scheitert `pnpm install` mit einer klaren Meldung —
# das ist die gewollte Richtung. Dann prüfen, ob die Zeile upstream
# abgesichert ist, und den Patch samt dieses Kommentars entfernen:
#
#   npm view eslint-plugin-react peerDependencies
patchedDependencies:
  eslint-plugin-react@7.37.5: patches/eslint-plugin-react@7.37.5.patch
