name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # These are read at module-evaluation time by src/lib/db/client.ts,
  # src/lib/auth/config.ts etc. even for jobs that never open a real
  # connection (lint/typecheck/build). Real values are irrelevant there;
  # integration-tests overrides DATABASE_URL/DIRECT_DATABASE_URL itself
  # once Testcontainers has started a real PostgreSQL — see
  # test/integration/rbac-audit-tenant.integration.test.ts.
  DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
  DIRECT_DATABASE_URL: 'postgresql://ci:ci@localhost:5432/ci'
  AUTH_SECRET: 'ci-placeholder-secret-never-used-at-runtime'
  AUTH_URL: 'http://localhost:3000'
  OIDC_ISSUER: 'http://localhost:8081/realms/proquado'
  OIDC_CLIENT_ID: 'ci-placeholder'
  OIDC_CLIENT_SECRET: 'ci-placeholder'
  RELEASE_TOKEN_SECRET: 'ci-placeholder-secret-never-used-at-runtime'

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm run test:unit

  # Testcontainers works out of the box on GitHub's ubuntu-latest runners
  # (Docker is preinstalled). This job applies REAL migrations to a REAL
  # PostgreSQL and exercises RLS/RBAC/audit behavior — see
  # docs/09_TEST_PYRAMID.md "Unverzichtbare Negativtests".
  integration-tests:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm run test:integration

  build:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm run build
