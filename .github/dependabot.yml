version: 2

# `dependency_scan` aus der Pipeline-Skizze in docs/09_TEST_PYRAMID.md.
# Sicherheitswarnungen und -korrekturen sind am Repository eingeschaltet; hier
# stehen die *regelmäßigen* Aktualisierungen.
#
# Monatlich und gebündelt, nicht täglich und einzeln: jeder Aktualisierungs-PR
# löst die vollständige Pipeline aus, inklusive E2E-Lauf mit drei Containern.
# Ein Strom einzelner Patch-PRs kostet mehr Aufmerksamkeit, als er Sicherheit
# bringt — und Aufmerksamkeit ist das, was am Ende darüber entscheidet, ob
# jemand hinsieht. Dringendes kommt ohnehin über die Sicherheitswarnungen,
# unabhängig von diesem Zeitplan.
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # Ein PR je Themengebiet statt einer je Paket. Die Testwerkzeuge
      # aktualisieren sich fast immer gemeinsam, und ein gescheiterter Lauf
      # zeigt dann sofort, welche Ecke betroffen ist.
      test-tooling:
        patterns:
          - '@playwright/*'
          - '@axe-core/*'
          - 'jest*'
          - '@types/jest'
          - 'testcontainers'
          - '@testcontainers/*'
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
          - 'eslint*'
          - 'prettier'
      # Next, React und Prisma bleiben einzeln: hier ist eine
      # Hauptversionsanhebung ein Vorgang mit eigenen Folgen, kein Sammelposten.
    ignore:
      # ESLint 10 ist blockiert, und zwar nicht bei uns. ESLint 10 entfernt die
      # alten `context`-Methoden; `eslint-config-next` 16 bringt
      # `eslint-plugin-react@7.37.5` mit, das `context.getFilename()` weiterhin
      # aufruft. Der Lauf stirbt sofort und für jede Datei:
      #
      #   TypeError: Error while loading rule 'react/display-name':
      #   contextOrFilename.getFilename is not a function
      #
      # Ausweichen geht nicht: 7.37.5 ist der aktuelle Stand des Plugins und
      # nennt als Peer `^9.7` als Obergrenze. Die Alternativen wären, die
      # React-Regeln abzuschalten oder die Konfiguration von Hand nachzubauen —
      # beides tauscht eine Versionsnummer gegen einen Teil der Prüfung.
      #
      # Der Eintrag steht hier statt in einem geschlossenen PR, weil ein PR,
      # der monatlich neu aufsteht und jedes Mal an derselben Stelle scheitert,
      # dazu erzieht, rote Läufe zu übersehen. Die Branch Protection würde ihn
      # ohnehin nicht durchlassen; das hier spart die Wiederholung.
      #
      # WIEDER ENTFERNEN, sobald das Plugin nachzieht — die Probe ist ein
      # Einzeiler:
      #
      #   npm view eslint-plugin-react peerDependencies
      #
      # Nennt die Antwort ESLint 10, gehört dieser Block weg. Patch- und
      # Minor-Anhebungen innerhalb von ESLint 9 laufen unverändert weiter.
      - dependency-name: eslint
        versions: ['>=10']

      # archiver 8 ist ESM-only, und das ist hier schon einmal ausprobiert und
      # zurückgenommen worden (notes.md, "ESM-only Abhängigkeiten brechen Jest
      # UND den Next-Build"). Beides scheitert sofort: Jest mit "Cannot use
      # import statement outside a module", der Build mit einem Webpack-Fehler
      # im selben Paket. Dazu ersetzt v8 die Factory-API `archiver('zip', …)`
      # durch Klassen, die Anhebung ist also auch kein reiner Versionswechsel.
      #
      # Der Typecheck sagt dazu nichts — die Typen von `@types/archiver@8` sind
      # einwandfrei, nur ließ sich das Paket nirgends laden. Deshalb gehören
      # beide hierher: getrennt ignoriert, käme sonst der Typ-Teil allein
      # wieder und passte dann nicht zur Laufzeitversion.
      #
      # WIEDER ENTFERNEN, sobald Jest und der Next-Build ESM tragen. Die Probe
      # ist der Versuch selbst, und zwar gegen BEIDE Läufe — `pnpm run build`
      # und `pnpm run test:integration`. Ein `pnpm run typecheck` allein
      # beantwortet die Frage nicht, siehe oben. Seit dem Exporttest
      # (`dossier-export.spec.ts`) würde ein Bruch zusätzlich auf Byte-Ebene
      # auffallen, statt erst beim nächsten Export von Hand.
      - dependency-name: archiver
        versions: ['>=8']
      - dependency-name: '@types/archiver'
        versions: ['>=8']

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: monthly
    # Die Node-20-Abkündigung der Actions steht seit dem ersten CI-Lauf als
    # Warnung in jedem Protokoll. Genau dafür ist dieser Eintrag da.
