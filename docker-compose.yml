name: proquado

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: proquado
      POSTGRES_PASSWORD: proquado_dev_only
      POSTGRES_DB: proquado
    ports:
      - '5433:5432'
    volumes:
      - ./.docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U proquado -d proquado']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: proquado
      MINIO_ROOT_PASSWORD: proquado_dev_only
    ports:
      - '9010:9000'
      - '9011:9001'
    volumes:
      - ./.docker-data/minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the document bucket MinIO doesn't auto-create, then
  # exits. Matches S3_BUCKET in .env.example — see src/lib/storage.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 proquado proquado_dev_only &&
      mc mb --ignore-existing local/proquado-documents
      "

  # The real virus scanner. Not started by the usual dev command (see notes.md
  # "Lokale Umgebung starten") because it downloads ~250 MB of signatures on
  # first boot and takes a minute or two to become ready — for everyday work
  # MALWARE_SCANNER=stub is the right setting.
  #
  # Start it explicitly when working on the upload path, and in every
  # environment that is not a developer laptop:
  #
  #   docker compose up -d clamav
  #   MALWARE_SCANNER=clamav pnpm run dev
  #
  # Readiness is a real health check here, not a formality: clamd accepts TCP
  # connections before its signature database is loaded, and a scan in that
  # window fails. `depends_on: condition: service_healthy` is what makes the
  # difference between "the container is up" and "the scanner works".
  clamav:
    image: clamav/clamav:1.4
    # ClamAV publishes amd64 images only — there is no arm64 manifest for any
    # tag. On an Apple-Silicon developer machine this runs under emulation
    # (slow, but it works and it is the same binary the pilot will run). Pinned
    # explicitly so the failure on ARM is "emulated" rather than the rather
    # unhelpful "no matching manifest for linux/arm64/v8".
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - '3310:3310'
    volumes:
      # Signatures survive a restart — re-downloading them every time is both
      # slow and unfriendly to the ClamAV mirrors.
      - ./.docker-data/clamav:/var/lib/clamav
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_dev_only
      KC_DB: dev-file
    ports:
      - '8081:8080'
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import

networks:
  default:
    name: proquado_dev
